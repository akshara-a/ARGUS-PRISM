[project]
name = "argus-prism"
version = "0.1.0"
description = "ARGUS PRISM: Deterministic Evidence Intelligence Layer via Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
    "networkx>=3.2.0",
    "pyvis>=0.3.2",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=8.1.1",
    "sentry-sdk>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
