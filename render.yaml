# ==============================================================================
# ARGUS PRISM - Render Blueprint Specification (render.yaml)
# ==============================================================================
# Deploy ARGUS PRISM on Render with 1 click via Blueprints:
# 1. Push code to GitHub / GitLab.
# 2. Go to https://dashboard.render.com/blueprints -> New Blueprint Instance.
# 3. Select this repository. Render parses this file and provisions the services.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI REST Backend & MCP Core
  # ----------------------------------------------------------------------------
  - type: web
    name: argus-prism-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn --app-dir backend/src argus.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "1.0"

      # ------------------------------------------------------------------------
      # Search Engine & Ingestion Configuration (Prompted in Render Dashboard)
      # ------------------------------------------------------------------------
      - key: DEFAULT_SEARCH_PROVIDER
        sync: false
      - key: DUCKDUCKGO_ENDPOINT
        sync: false
      - key: DUCKDUCKGO_REFERER
        sync: false
      - key: ARGUS_MOCK_FALLBACK
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

      # ------------------------------------------------------------------------
      # ElevenLabs Spoken Audio Voice Personas & API Keys
      # ------------------------------------------------------------------------
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_API_ENDPOINT
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_VOICE_RACHEL
        sync: false
      - key: ELEVENLABS_VOICE_ADAM
        sync: false
      - key: ELEVENLABS_VOICE_DREW
        sync: false

      # ------------------------------------------------------------------------
      # Observability & AI Triangulation Secrets
      # ------------------------------------------------------------------------
      - key: SENTRY_DSN
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Next.js 16 Web Studio (Executive Zero-Login Human Interface)
  # ----------------------------------------------------------------------------
  - type: web
    name: argus-prism-studio
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://argus-prism-api.onrender.com
      - key: NEXT_PUBLIC_DASHBOARD_URL
        value: https://argus-prism-dashboard.onrender.com

  # ----------------------------------------------------------------------------
  # 3. Streamlit Visual Telemetry & DAG Explorer
  # ----------------------------------------------------------------------------
  - type: web
    name: argus-prism-dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: streamlit run backend/src/argus/dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "1.0"

      # ------------------------------------------------------------------------
      # Search Engine & Ingestion Configuration (Prompted in Render Dashboard)
      # ------------------------------------------------------------------------
      - key: DEFAULT_SEARCH_PROVIDER
        sync: false
      - key: DUCKDUCKGO_ENDPOINT
        sync: false
      - key: DUCKDUCKGO_REFERER
        sync: false
      - key: ARGUS_MOCK_FALLBACK
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

      # ------------------------------------------------------------------------
      # ElevenLabs Spoken Audio Voice Personas & API Keys
      # ------------------------------------------------------------------------
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_API_ENDPOINT
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_VOICE_RACHEL
        sync: false
      - key: ELEVENLABS_VOICE_ADAM
        sync: false
      - key: ELEVENLABS_VOICE_DREW
        sync: false

      # ------------------------------------------------------------------------
      # Observability & AI Triangulation Secrets
      # ------------------------------------------------------------------------
      - key: SENTRY_DSN
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
