name: CI Benchmark & Unit Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Execute Deterministic Benchmark Harness (7 Tests)
        run: |
          python backend/evaluate.py

      - name: Execute Unit Test Suite (pytest)
        run: |
          pytest -v --tb=short

      - name: Execute 1-Click End-to-End Showcase Demo
        run: |
          python backend/demo.py
